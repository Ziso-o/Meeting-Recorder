# glossary.yaml — 용어집 (사업명 / 기관명 / 기술약어 / 인명)
# ---------------------------------------------------------------------------
# 이 파일은 이 시스템의 진짜 IP다. 두 곳에 주입되어 전사·회의록 품질을 좌우한다.
#   1) Phase 2 전사(initial_prompt): projects/organizations/people + acronyms.term 을
#      쉼표로 이어 whisper에 힌트로 준다  → 고유명사 인식률↑ (glossary_terms)
#   2) Phase 1 용어교정 단계: 아래 전체를 사람이 읽는 표로 변환해 LLM에 준다
#      → "래그"→"RAG" 같은 STT 오인식만 교정 (glossary_to_prompt)
#
# 운영 원칙
#   - **실제 회의에 등장하는 값만** 넣는다. 관련 없는 항목을 많이 넣으면
#     whisper initial_prompt가 편향되고 교정 단계가 엉뚱한 교정을 한다.
#   - acronyms 는 도메인 공통 어휘라 넉넉히 둬도 안전하지만, projects/organizations/
#     people 은 이번 사업의 실제 참여 주체로 **좁혀서** 유지한다.
#   - 실회의 산출물(.minutes.md)을 사람이 검토 → 틀린 고유명사를 여기 반영 → 재실행.
#     (TODO.md 4-(c) 루프)
# ---------------------------------------------------------------------------

# =========================================================================
# 사업명 — ⚠️ 실제 사업명으로 교체할 것 (아래는 형식 예시 플레이스홀더)
#   정식 사업명 + 회의에서 실제로 부르는 약칭을 함께 넣으면 교정에 유리하다.
# =========================================================================
projects:
  - "○○○ 지능형 통합관제 플랫폼 구축 사업"      # TODO: 실제 정식 사업명으로 교체
  - "차세대 행정정보시스템 고도화 사업"          # TODO: 실제 사업명 / 약칭 추가

# =========================================================================
# 기관명 — 이번 사업의 실제 발주처·수행사·유관기관만 남길 것
#   (아래 활성 목록은 흔한 공공 발주 기관 예시. 실제 참여 기관으로 교체/축소)
# =========================================================================
organizations:
  - "행정안전부"
  - "한국지능정보사회진흥원(NIA)"
  - "국가정보자원관리원"
  # --- 자주 등장하면 주석 해제해 사용 (실제 참여 기관만) ---
  # - "과학기술정보통신부"
  # - "조달청"
  # - "한국인터넷진흥원(KISA)"
  # - "개인정보보호위원회"
  # - "국가정보원(국정원)"
  # - "한국정보통신기술협회(TTA)"
  # - "감사원"

# =========================================================================
# 기술 약어 (term: 정답 표기, aliases: STT 가 흔히 틀리는 표기들)
#   aliases 는 한국어 음성인식이 실제로 잘못 옮기는 표기를 적을수록 교정력이 좋아진다.
#   도메인 공통 어휘라 넉넉히 두어도 안전하다. 이번 회의에 안 나오는 건 지워도 무방.
# -------------------------------------------------------------------------
acronyms:
  # --- AI / 데이터 ---
  - term: "LLM"
    aliases: ["엘엘엠", "엘 엘 엠", "llm"]
  - term: "RAG"
    aliases: ["래그", "라그", "렉", "rag"]
  - term: "STT"
    aliases: ["에스티티", "에스 티 티", "stt"]
  - term: "OCR"
    aliases: ["오씨알", "오 씨 알", "ocr"]
  - term: "파인튜닝"
    aliases: ["파인 튜닝", "화인튜닝", "fine tuning"]
  - term: "벡터DB"
    aliases: ["벡터 디비", "벡터디비", "벡터 db"]
  - term: "ETL"
    aliases: ["이티엘", "이 티 엘", "etl"]

  # --- 인프라 / 아키텍처 ---
