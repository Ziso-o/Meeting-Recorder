    aliases: ["에이피아이", "에이피아", "에이 피 아이", "api"]
  - term: "온프레미스"
    aliases: ["온프렘", "온 프레미스", "온프리미스"]
  - term: "클라우드"
    aliases: ["크라우드", "클라우"]
  - term: "G-클라우드"
    aliases: ["지클라우드", "지 클라우드", "g클라우드", "g 클라우드"]
  - term: "온나라"
    aliases: ["온 나라", "온나라시스템", "온 나라 시스템"]
  - term: "망분리"
    aliases: ["망 분리", "방분리"]
  - term: "VDI"
    aliases: ["브이디아이", "브이 디 아이", "vdi"]
  - term: "MSA"
    aliases: ["엠에스에이", "엠 에스 에이", "msa"]
  - term: "쿠버네티스"
    aliases: ["쿠버네이티스", "쿠버 네티스", "kubernetes", "k8s"]
  - term: "CI/CD"
    aliases: ["씨아이씨디", "씨 아이 씨 디", "ci cd", "ci/cd"]
  - term: "IaaS"
    aliases: ["이아스", "아이아스", "iaas"]
  - term: "SaaS"
    aliases: ["사스", "에스아에스", "saas"]
  - term: "PaaS"
    aliases: ["파스", "피아스", "paas"]

  # --- 정보화 사업 관리 / 제도 ---
  - term: "RFP"
    aliases: ["알에프피", "알 에프 피", "제안요청서", "rfp"]
