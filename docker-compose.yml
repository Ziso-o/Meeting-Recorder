# Phase 3 — n8n(오케스트레이션) + Ollama(로컬 LLM, secure 프로파일)
#
# 사용:
#   cp .env.example .env   # 값 채우기 (GEMINI_API_KEY / GROQ_API_KEY / HF_TOKEN 등)
#   docker compose up -d --build
#   n8n:    http://localhost:5678
#   회의 오디오를 ./data/inbox 에 넣으면 워크플로우가 감지 → 회의록 생성
#   결과:   ./data/out/{secure,internal}/*.minutes.md
#
# 보안등급 분기:
#   - 파일명/경로에 'secure' 포함 → profile=secure → Ollama(로컬) LLM, 결과는 out/secure
#   - 그 외                         → profile=internal → Gemini(클라우드) LLM, 결과는 out/internal

services:
  ollama:
    image: ollama/ollama:latest
    container_name: mr_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU가 있으면 아래 주석 해제 (NVIDIA Container Toolkit 필요)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  n8n:
    build:
      context: .
      dockerfile: docker/Dockerfile.n8n
    container_name: mr_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=${TZ:-Asia/Seoul}
      # minutes CLI가 참조하는 값 (Execute Command 노드로 전달됨)
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:14b}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      # 전사 엔진: 경량 이미지 기본은 groq. 로컬 GPU면 faster-whisper 로.
      - ASR_ENGINE=${ASR_ENGINE:-groq}
      - DIARIZER=${DIARIZER:-pyannote}
      # 실패 알림용 웹훅 (Slack/Teams 등) — 선택
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      # Vexa 봇 연동 (Phase 4)
      - VEXA_API_URL=${VEXA_API_URL:-http://vexa:8000}
      - VEXA_API_KEY=${VEXA_API_KEY:-}
      - VEXA_BOT_NAME=${VEXA_BOT_NAME:-회의록봇}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/data              # inbox(입력 오디오) / out(회의록) 공유
    depends_on:
      - ollama

  # ---- Phase 4: Vexa 봇 (Apache-2.0, 셀프호스팅) ----
  # ⚠️ Vexa는 본래 다중 컨테이너 스택(gateway/bot-manager/whisperlive/db 등)으로 운영한다.
  #    운영 배포는 공식 레포의 compose를 사용하는 것을 권장한다:
  #        https://github.com/Vexa-ai/vexa
  #    아래 항목은 우리 스택과 동일 네트워크에서 Vexa API 게이트웨이를 노출하기 위한
  #    스캐폴드다. `image`를 실제 사용하는 Vexa 게이트웨이 이미지로 교체할 것.
  #    opt-in 프로파일이라 기본 `docker compose up`에서는 뜨지 않는다:
  #        docker compose --profile vexa up -d
  vexa:
    image: ${VEXA_IMAGE:-vexaai/vexa-gateway:latest}   # TODO: 실제 Vexa 게이트웨이 이미지로 교체
    container_name: mr_vexa
    profiles: ["vexa"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ADMIN_API_KEY=${VEXA_ADMIN_KEY:-}
    # Vexa 전체 스택(bot-manager, whisperlive, redis, postgres 등)은 공식 compose 참조.

volumes:
  n8n_data:
  ollama_data:
